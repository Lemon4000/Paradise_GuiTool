# Build and Release Configuration
# 构建和发布配置文件

[App]
# 应用名称
Name=UsartGUI

# 应用版本（自动管理，通常无需修改）
Version=2.0.0

[Build]
# 是否打成单文件 exe (true/false)
# true: 单个 UsartGUI.exe，更方便分发
# false: 整个文件夹，更轻量但需要运行环境
OneFile=true

# PyInstaller 编译优化级别
# 0: 无优化（快速编译）
# 1: 基础优化
# 2: 最大优化（编译较慢）
OptimizeLevel=1

[Release]
# Release 目录名称
ReleaseDir=release

# 是否保留所有历史版本
# true: 保留，用于回滚
# false: 只保留最新版本
KeepHistory=true

# 自动生成 CHANGELOG
GenerateChangelog=true

[Package]
# 压缩级别 (Optimal/Fastest/NoCompression)
CompressionLevel=Optimal

# 包含的额外文件/目录（相对路径，逗号分隔）
# 示例: LICENSE,README.md,CHANGELOG.md
ExtraIncludes=

# 排除的文件/目录（相对路径，逗号分隔）
ExtraExcludes=__pycache__,*.pyc

[Notifications]
# 打包完成后是否显示通知
ShowNotification=true

# 自动打开 release 目录
OpenReleaseFolder=true

# 构建日志保留天数（0=永远保留）
LogRetentionDays=30
